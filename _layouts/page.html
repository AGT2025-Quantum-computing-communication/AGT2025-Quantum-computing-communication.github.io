
---
layout: default
---

<article class="content-page">

  {% if page.title %}
    <header class="page-header">
      <h1>{{ page.title }}</h1>

      {% if page.description %}
        <p class="page-description">
          {{ page.description }}
        </p>
      {% endif %}
    </header>
  {% endif %}

  <div class="page-content">
    {{ content }}
  </div>

  <div class="page-navigation">
    {% if page.lang == "fr" %}
      <a href="{{ '/fr/' | relative_url }}">
        &larr; Retour à l'accueil
      </a>
    {% else %}
      <a href="{{ '/en/' | relative_url }}">
        &larr; Back to Home
      </a>
    {% endif %}
  </div>

</article>
